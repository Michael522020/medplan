<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MedPlan 医学影像阅片与手术规划系统</title>
    <!--
      主题引导脚本：必须在首屏渲染前同步执行，否则会出现主题闪烁。
      与 src/theme/theme.ts 的 THEME_BOOTSTRAP_SCRIPT 保持一致。
    -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('medplan.theme');
          if (t !== 'light' && t !== 'dark') {
            t = 'dark';
          }
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
