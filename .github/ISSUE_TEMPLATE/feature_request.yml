name: 功能建议
description: 提出一个功能需求或改进想法
title: '[建议] '
labels: ['enhancement', '待讨论']
body:
  - type: markdown
    attributes:
      value: |
        这个项目有两个「边界」类的硬约束，建议前请先确认你的需求不与之冲突：

        1. **AI 不出具诊断结论**。AI 只做分割标记与量化指标，诊断结论必须由执业医师确认并电子签名。
           这是《人工智能医疗器械注册审查指导原则》下的边界要求，不是实现取舍。
        2. **越权响应不可区分**。越权（10004）与「资源不存在」（10005）的响应时间、
           状态码、响应体大小必须一致，避免成为患者存在性的预言机。
           任何削弱这一点的改动都会被拒绝。

  - type: textarea
    id: problem
    attributes:
      label: 你遇到的实际问题是什么
      description: 描述场景，而不是直接描述解法
      render: text
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你建议怎么解决
    validations:
      required: false

  - type: dropdown
    id: scope
    attributes:
      label: 涉及范围
      options:
        - 前端
        - 后端
        - 数据库
        - 部署运维
        - 文档
        - 门禁与工具链
    validations:
      required: true

  - type: checkboxes
    id: compliance
    attributes:
      label: 合规影响确认
      options:
        - label: 这个改动不涉及诊断结论的生成路径
          required: true
        - label: 这个改动不削弱越权响应的不可区分性
          required: true
        - label: 如果涉及加密算法或模型权重，我已确认许可兼容性（见 docs/licenses/THIRD-PARTY.md）
          required: false
