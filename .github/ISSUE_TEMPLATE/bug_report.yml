name: 缺陷报告
description: 报告一个可复现的问题
title: '[缺陷] '
labels: ['bug', '需要复现']
body:
  - type: markdown
    attributes:
      value: |
        感谢你发现问题。

        **本项目是医疗信息系统，涉及患者数据（PHI）的所有内容都不接受真实数据。**
        报告问题时请用虚构数据（如 `张*明`、`ACC00000001`）。

  - type: input
    id: version
    attributes:
      label: 版本 / commit
      description: 出问题的 commit（`git log -1 --format=%h`）或发布版本
      placeholder: a8c46b9
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: 出问题的部分
      options:
        - 前端阅片工作台
        - 前端其他页面（工作台 / 报告 / 登录）
        - 后端 API
        - 数据库 / 迁移
        - 部署与运维
        - 门禁脚本 / CI
        - 文档
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: 实际发生了什么
      description: 描述你观察到的行为
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 你期望发生什么
      description: 如果这是合规相关的行为偏差，请特别说明 —— 这类问题优先级最高
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      description: |
        1.
        2.
        3.
      render: text
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 错误日志或截图
      description: |
        请**先脱敏**：不要贴出口令、令牌、Authorization 头、真实患者数据。
        日志格式约定见 docs/ops/RUNBOOK.md。
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我确认没有在报告中包含任何真实患者数据、口令或凭证
          required: true
        - label: 我已搜索过现有 issue，确认不是重复报告
          required: false
