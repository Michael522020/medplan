  /api/v1/wado/instances:
    post:
      tags: [WADO]
      operationId: wadoRetrieveInstances
      summary: WADO-RS 取图（阅片网关代理）
      description: |
        阅片网关代理 DICOMweb WADO-RS。**不直接暴露 dcm4chee 地址**，
        原因有三：
        1. PACS 不可绕过审计（每次取图必须落 `audit_logs`，AC-17）；
        2. 可在网关层强制 L3 患者数据权限（直连 PACS 会绕过本系统授权模型）；
        3. 可隐藏院内 PACS 拓扑（等保 8.1.4.6）。

        **取图协议说明**：标准 WADO-RS 用 GET + URL 参数表达资源选择，本契约用 POST +
        JSON body 表达批量帧选择（1.2.840.10008.5.1.4.1.1.7 中 WADO-RS 的
        `application/dicom` 载荷在多实例场景需 multipart 打包，POST body 更便于
        Cornerstone 影像缓存按 `sopUid` 去重）。

        **性能约束（AC-05）**：2000 层 0.5mm 薄层 CT 首帧 ≤3s、全量 ≤15s。
        实现要求：`metadataOnly: true` 时只返回 DICOM JSON 元数据（几十 KB），
        前端先渲染序列结构再渐进填充像素；`maxInstances` 限制单次批量上限，
        预取窗口由前端控制（首屏 ±20 层，预取半径 30 层，并发 6）。

        **传输语法协商**：JPEG2000 Lossless（`1.2.840.10008.1.2.4.90`）为薄层 CT 首选，
        需前端 `@cornerstonejs/codec-openjpeg` 1.3.0 支持；不可用时回退
        `1.2.840.10008.1.2.1`（未压缩，流量放大约 8 倍，仅作降级）。

        前端接入：`streaming-image-volume-loader` 1.86.1 通过自定义 imageId 工厂
        调本端点，**必须**在 `dicomImageLoader.wadors.configure({ beforeSend })`
        注入 `Authorization` 头。
      x-audit: true
      x-audit-event: DICOM_INSTANCES_RETRIEVED
      x-audit-phi: true
      x-idempotent: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WadoRetrieveRequest'
            examples:
              firstFrameWindow:
                summary: 首屏取图（门脉期 ±20 层）
                value:
                  studyUid: '1.2.840.10008.5.1.4.1.1.2.20261022100336'
                  seriesUid: '1.2.840.10008.5.1.4.1.1.2.20261022100336.728573'
                  instanceNumbers: [128, 129, 130, 131, 132, 133, 134, 135, 136, 137, 138, 139, 140, 141, 142, 143, 144, 145, 146, 147, 148, 149, 150, 151, 152, 153, 154, 155, 156, 157, 158, 159, 160, 161, 162, 163, 164, 165]
                  transferSyntaxUid: '1.2.840.10008.1.2.4.90'
                  maxInstances: 64
                  metadataOnly: false
              metadataOnly:
                summary: 仅取元数据（先渲染序列结构）
                value:
                  studyUid: '1.2.840.10008.5.1.4.1.1.2.20261022100336'
                  seriesUid: '1.2.840.10008.5.1.4.1.1.2.20261022100336.728573'
                  transferSyntaxUid: '1.2.840.10008.1.2.4.90'
                  metadataOnly: true
      responses:
        '200':
          description: |
            成功。`metadataOnly: true` 时返回 DICOM JSON 元数据数组；
            否则返回 DICOM Part 10 二进制（单实例 `application/dicom`，
            多实例 `multipart/related; type="application/dicom"`）。
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Instance-Count:
              description: 本次实际返回的实例数。前端据此判断是否需要续拉（失败时用于显示已加载层数）
              schema:
                type: integer
              example: 38
          content:
            application/dicom:
              schema:
                type: string
                format: binary
              examples:
                dicomPart10:
                  summary: 单实例 DICOM Part 10（Base64 示意，实际为二进制流）
                  value: 'ZklSQVRFAAAAAAAADQ4NjIwMzQ1NjcyODkwMTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nw=='
            multipart/related:
