openapi: 3.0.3

info:
  title: MedPlan API
  version: 1.0.0
  description: |
    # MedPlan — 企业级医学影像阅片与手术规划系统

    本文件是**前后端唯一契约**。前端类型由本文件生成（`openapi-typescript`），
    后端 DTO 与参数校验由本文件生成或逐条对齐。实现与本文件冲突时，先改本文件再改代码。

    ---

    ## 0. 版本与文档效力

    | 项 | 值 |
    |----|----|
    | 契约版本 | 1.0.0（对应 docs/Spec.md 2026-10-22 锁定版） |
    | 上游依据 | docs/Spec.md §5 端点清单（锁定）、docs/架构方案.md §7.6 错误码、§10.1 三层权限 |
    | 生成物 | 前端 `src/services/api-types.ts`（禁止手写重复类型） |
    | 变更流程 | 任何端点/字段变更必须先改本文件，经 Team Lead 同步前后端 |

    ## 1. 统一响应包裹

    所有端点（成功与失败）均返回同一结构：

    - 成功：`{ "code": 0, "data": { ... }, "message": "" }`
    - 失败：`{ "code": 10001, "data": null, "message": "..." , "traceId": "..." }`

    前端**禁止**依据 HTTP 状态码做业务分支，只依据 `code`。

    ## 2. 幂等约定

    Spec §5 标注「幂等 = 是」的 5 个端点，`Idempotency-Key` header 为**必填**：

    | 端点 | 幂等理由 |
    |------|---------|
    | POST /segmentation-tasks | 重提不产生重复 GPU 计算（Redis Stream 至少一次投递） |
    | POST /segmentation-tasks/{taskId}/confirm | 重复点击确认不产生重复确认记录 |
    | POST /plans | 双击保存不产生两份规划方案 |
    | PUT /plans/{planId} | 重试不产生多余版本 |
    | POST /reports/{reportId}/sign | 重复提交不产生重复签名与重复流水号 |

    **不携带 `Idempotency-Key` 的两个 POST**（依据 Spec §5 幂等列判定，不做超范围施加）：

    | 端点 | 不要求的原因 |
    |------|-------------|
    | POST /auth/login | Spec §5 幂等 = 否。登录幂等会导致会话复用，反而削弱双因素语义 |
    | POST /wado/instances | 本质是只读取图（Spec §5 幂等 = 否）。取图幂等由 HTTP 缓存与 Cornerstone 影像缓存保证，施加业务幂等键只会增加阅片首帧延迟（AC-05 首帧 ≤3s） |

    幂等键语义：同一 `Idempotency-Key` + 同一请求体 -> 返回首次结果，`HTTP 200` +
    `data.idempotentReplay = true`（首次创建为 `201`）；同一 `Idempotency-Key` +
    **不同**请求体 -> `code 10001`（幂等键冲突）。幂等记录保留 24 小时。

    ## 3. 认证与双因素

    - 会话：`Authorization: Bearer <access_token>`，JWT，由 Keycloak 26.8.1 OIDC 签发。
    - 第二因素：**UKey 数字证书**（SM2），口令 + UKey 双因素。短信验证码不可替代（ADR-005）。
    - `access_token` 载荷含 `ukey_cert_serial`，即会话本身已绑定 UKey；
      **签名动作**（POST /reports/{reportId}/sign）需**再次**出示 UKey 并对本次摘要签名，
      因为签名是法律行为，须逐次意思表示（WS/T 847—2024 签名超时机制：前端 5 分钟无操作须重新认证）。

    ## 4. 错误码（Spec §5 锁定 + 架构方案 §7.6 分段）

    | code | 含义 | HTTP | 说明 |
    |------|------|------|------|
    | 0 | 成功 | 200 / 201 | — |
    | 10001 | 参数错误 | 400 | 含幂等键冲突、枚举非法、长度越界 |
    | 10002 | 未认证 | 401 | Token 缺失、过期、签名不合法 |
    | 10003 | 无权限（角色级） | 403 | RBAC 判定失败，与患者是否存在无关 |
    | **10004** | **越权（数据级）** | **404** | **响应时间、状态码、响应体大小三者须与「患者不存在」不可区分** |
    | 10005 | 资源不存在 | 404 | 仅用于**非 PHI 导航**资源（UUID v7 不可枚举），见下方安全设计 |
    | 20001 | 业务校验失败 | 422 | 语义合法但业务不成立 |
    | 20002 | 业务前置不满足 | 422 | 如平扫提交肝胆分割、未完成 AI 确认即提交报告 |
    | **20003** | **乐观锁版本冲突** | **409** | **本契约新增**，Spec §5 未定义；对应 AC-07 与架构方案 12.2 E7「版本冲突返回 409」 |
    | 30001 | PACS 不可达 | 503 | dcm4chee 或 DICOMweb 上游异常 |
    | 30002 | 检查/序列不存在于 PACS | 404 | 业务库有元数据但 PACS 无归档对象 |
    | 30003 | 序列拉取失败 | 502 | 取图过程失败，须返回已加载层数供前端提示 |
    | 40001 | AI 队列已满 | 429 | — |
    | 40002 | AI 推理失败 | 500 | 必须返回失败环节，禁止以空模型冒充成功 |
    | **40003** | **模型许可不在白名单** | **400** | **启动强校验，非 Apache-2.0 白名单拒绝并审计**（AC-09） |
    | 40004 | 模型版本不匹配 | 409 | 权重版本与锁定 2.18.0 不符 |
    | 50001 | 报告未审核不可签名 | 409 | — |
    | 50002 | 签名服务不可达 | 503 | 密码机或 TSA 不可用 |
    | 50003 | 签名后编辑被拒 | 409 | 签名失效（AC-14） |
    | 50004 | 归档后修改需审批 | 409 | — |
    | 90001 | 内部错误 | 500 | **不得暴露堆栈、SQL、内部主机名** |

    ### 4.1 越权不可区分的实现规则（安全设计，非风格偏好）

    Spec §5 要求 10004 与「患者不存在」不可区分。若两者 `code` 不同，攻击者读 `code`
    即可判断患者在本院是否存在检查 —— 泄露成立。因此本契约按**资源类别**把两个码
    互斥化，使**任何可由 PHI 导航到的路径上只有一个码**：

    | 资源类别 | 端点 | 不存在时 | 越权时 | 可区分性 |
    |---------|------|---------|-------|---------|
    | PHI 可导航（经患者/检查/就诊到达） | GET /studies、GET /studies/{studyUid}/series、POST /wado/instances、POST/PUT /plans | **10004** | **10004** | 无。同一码、同一 HTTP 404、同一 message 字面量、响应体字节数相同 |
    | 非 PHI 导航（主键为 UUID v7，122 bit 熵，不可枚举） | GET /segmentation-tasks/{taskId}、GET /reports/{reportId}、POST /.../confirm、POST /.../sign、PUT /plans/{planId} | **10005** | **10004** | 攻击者无法构造有效 UUID v7，不构成患者存在性预言机 |

    实现要求（后端）：
    1. 上述两类响应使用**同一段常量 message 字符串**，禁止拼接资源名或患者名。
    2. 命中 10004 前必须先执行一次等价的数据库探测（查询恒定返回同一索引路径），
       使两条路径的耗时分布一致；响应不得提前返回。
    3. 侧信道专项测试列入验收：1000 次采样，「越权」与「不存在」的响应时间 p99 差异 < 20%（架构方案 12.3 C-3）。

    ## 5. 审计标注

    - `x-audit: true` 表示后端**必须**挂审计拦截器，审计写入失败则整个请求失败（不允许静默丢弃审计）。
    - `x-audit-event` 为事件类型枚举，落 `audit_logs.event_type`。
    - `x-audit-phi` 表示该端点是否返回患者可识别信息（PHI）。审计查询端点自身 `x-audit-phi: true`，
      因为其响应含患者标识与操作人标识。
    - 失败路径（越权拒绝）**同样写审计**（架构方案 10.4）。

    ## 6. AI 合规边界（强约束）

    依据《人工智能医疗器械注册审查指导原则》（器审中心 2022 年第 8 号）：

    - 本系统 AI 能力（自动分割、量化测量、三维重建）属**非辅助决策类**，不触及三类证。
    - **AI 输出 schema 中不存在任何自由文本字段**，因此在类型层面不可能承载诊断结论。
      `SegmentationStructure` 只含解剖结构名与量化体积，`additionalProperties: false`。
    - **禁止出现** `nature` / `diagnosis` / `malignancy` / `benign` / `impression` /
      `suggestion` / `recommendation` / `conclusion` / `comment` 等字段。
    - AI 相关字段**只能**出现在报告的 `aiAssist` 分组内，且该分组只承载结构化引用
      （结构名 + 体积 + 确认医师 + 确认时间），不承载任何结论性文本。
    - 诊断意见 `impression` 的 `authoredBy` 恒为执业医师，无 AI 作者分支。
    - 全部 AI 输出必须附带固定声明串（`AI_DISCLAIMER`），前端不可折叠、不可关闭。

    ## 7. 数据脱敏

    - 响应中的患者姓名一律掩码（`张*明`），完整姓名仅在质控/病案角色下由后端按
      `x-deidentify: false` 请求头单独放行，且该路径强制写审计。
    - 身份证**只返回掩码**（`310***********1234`），后端不提供返回明文的接口。
    - 手机号后端不返回（前端无此展示需求）。

  contact:
    name: MedPlan 架构（高见远）
    email: architecture@medplan.internal.example
  license:
    name: 院内私有化交付，LicenseRef-Proprietary

servers:
  - url: https://medplan.hospital.internal
    description: 院内生产（等保三级，院内 TLS）
  - url: https://medplan.test.hospital.internal
    description: 院内测试环境

security:
  - bearerAuth: []

tags:
  - name: Auth
    description: 双因素登录
  - name: Studies
    description: 检查与序列元数据
  - name: WADO
    description: DICOMweb WADO-RS 取图（经阅片网关代理）
  - name: Segmentation
    description: AI 辅助分割（非辅助决策类）
  - name: Planning
    description: 三维入路规划方案（乐观锁）
  - name: Reports
    description: 结构化报告与医师电子签名
  - name: Audit
    description: 审计查询（管理员）

paths:
  /api/v1/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: 双因素登录（口令 + UKey 数字证书）
      description: |
        等保三级 8.1.4.1 要求两种及以上鉴别技术组合，且其中一种至少使用密码技术。
        本端点实现口令 + UKey SM2 数字证书。**短信验证码不可替代**（AC-02）。

        实现要点：
        1. 口令校验委托 Keycloak 26.8.1，MedPlan 不存储口令。
        2. UKey 校验链：证书有效期 -> 颁发者链 -> 吊销列表（CRL/OCSP）-> 私钥签名验证。
           任一失败即拒绝，且**不透露失败的具体环节**（避免证书状态侧信道）。
        3. 返回 `ntpOffsetMs`，前端在偏移 > 1000ms 时提示医师时钟异常
           （签名时偏移 > 阈值须拒绝签名且**不得用本地时间兜底**，AC-15）。
        4. 成功与失败**均**写审计（`x-audit: true`）。
      security: []
      x-audit: true
      x-audit-event: AUTH_LOGIN
      x-audit-phi: false
      x-idempotent: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              ukeyDoctor:
                summary: 影像科主任医师登录（口令 + UKey）
                value:
                  username: dr.zhou.liqun
                  password: '********'
                  ukey_cert: 'MIIBszCCAV2gAwIBAgIUJ0E6cRMhLN3vMA0GCSqGSIb3DQEBCwUAMBExDzANBgNVBAMMBnBseTEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5'
                  ukey_pin_block: '9f3a1c7e5b2d84096a3f1c8e7d5b2a40'
      responses:
        '200':
          description: 登录成功，返回会话令牌
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              examples:
                success:
                  summary: 登录成功
                  value:
                    code: 0
                    message: ''
                    data:
                      accessToken: '<示例JWT，非真实凭证>'
                      refreshToken: '<示例JWT，非真实凭证>'
                      tokenType: Bearer
                      expiresIn: 28800
                      ntpOffsetMs: 42
                      user:
                        userId: 'u-1-0a82f1a9'
                        loginName: dr.zhou.liqun
                        displayName: 周立群
                        title: 主任医师
                        department: 医学影像科
                        licenseNoMasked: '110***********4317'
                        roles: [image_chief, report_signer]
                      ukey:
                        certSerial: '7921456789012345678901234567890'
                        subjectName: 'CN=周立群, OU=医学影像科, O=示范市中心医院, C=CN'
                        issuerName: 'CN=示范市医院数字证书颁发机构, O=示范市卫生健康委员会, C=CN'
                        validFrom: '2025-03-11T00:00:00+08:00'
                        validTo: '2028-03-10T23:59:59+08:00'
                        signatureAlgorithm: SM2
        '400':
          $ref: '#/components/responses/ErrInvalidParam'
        '401':
          $ref: '#/components/responses/ErrUnauthenticated'
        '423':
          description: 账号锁定（连续失败达阈值，锁定 15 分钟）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: 10002
                message: '用户名、口令或 UKey 证书无效'
                traceId: '01JB2Q7X3ZC4V8N0T5R9W'
        '503':
          description: 认证服务不可达
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: 90001
                message: '认证服务暂时不可用，请稍后重试'
                traceId: '01JB2Q7Y8HD2M6P8V0S1X'

  /api/v1/studies:
    get:
      tags: [Studies]
      operationId: listStudies
      summary: 检查列表（按数据权限过滤）
      description: |
        返回当前用户**有权访问**的检查列表。过滤在 SQL 层完成（`patient_grants` 关联），
        **禁止**先查全量再在应用层过滤（会泄露患者存在性且无法分页）。

        越权与不存在返回同一响应（见 info.description §4.1）。

        查询走 `idx_studies_patient_date`，P95 ≤ 3s（PRD DCM-01）。
      x-audit: true
      x-audit-event: STUDY_LIST_VIEWED
      x-audit-phi: true
      x-idempotent: false
      parameters:
        - $ref: '#/components/parameters/PatientId'
        - $ref: '#/components/parameters/AccessionNo'
        - $ref: '#/components/parameters/Modality'
        - $ref: '#/components/parameters/StudyDateFrom'
        - $ref: '#/components/parameters/StudyDateTo'
        - $ref: '#/components/parameters/StudyStatus'
        - $ref: '#/components/parameters/VisitType'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Deidentify'
      responses:
        '200':
          description: 检查列表
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudyListResponse'
              examples:
