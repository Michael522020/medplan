                traceId: '01JB2QA2Q1NG6I0S5U8W2'

  /api/v1/segmentation-tasks/{taskId}:
    get:
      tags: [Segmentation]
      operationId: getSegmentationTask
      summary: 查询分割任务状态与结果
      description: |
        轮询端点。前端建议轮询间隔 3s 起、退避至 10s，任务进入终态后停止。

        **AI 输出合规约束（强）**：`structures[]` 中**只有**解剖结构名与量化体积，
        **没有任何自由文本字段**，`additionalProperties: false`。
        因此 AI 在类型层面不可能产出诊断结论（器审中心 2022 年第 8 号边界）。

        `failed` 时必须返回 `error.failedAtStep`（失败环节）与 `error.code`，
        **禁止**以空模型或零体积列表冒充成功（AI-02 硬要求）。

