  /api/v1/reports/{reportId}:
    get:
      tags: [Reports]
      operationId: getReport
      summary: 获取结构化报告
      description: |
        返回卫健委电子病历必备字段（架构方案 §7.3 全覆盖）：

        | 规范字段 | 响应位置 |
        |---------|---------|
        | 患者基本信息 | `patient` |
        | 就诊信息 | `visit` |
        | 检查信息 | `study` |
        | 检查所见 | `structuredFields.findings[]`（分段结构化） |
        | 诊断意见 | `structuredFields.impression` |
        | 建议随访 | `structuredFields.followUpRecommendation` |
        | 报告医师 | `structuredFields.findings[].authoredBy` / `structuredFields.impression.authoredBy` |
        | 审核医师 | `reviewer` |
        | 报告时间 | `reportTime` |
        | 修改痕迹 | `revisionHistory[]` + 审计日志 |
        | 签名有效性 | `signature` |
        | AI 参与声明 | `structuredFields.aiAssist.disclosure` |

        **五类受控字段**（RPT-01）：检查部位 `examBodyPart`、扫描方式 `scanMode`、
        影像所见 `findings`、影像诊断意见 `impression`、建议随访 `followUpRecommendation`。
        任一为空 -> **阻断签名**（AC-12）。

        **AI 字段只出现在 `structuredFields.aiAssist` 内**（COM-08）。
        该分组只含结构化引用（结构名 + 体积 + 确认医师 + 确认时间），
        **不含任何结论性文本**。`impression.authoredBy` 恒为执业医师。

        `status != signed` 时，`structuredFields.impression` 对**非报告相关角色**
        返回掩码（防止未签署报告的诊断意见外泄，架构方案 §9.2 末条）。
      x-audit: true
      x-audit-event: REPORT_VIEWED
      x-audit-phi: true
      x-idempotent: false
      parameters:
        - $ref: '#/components/parameters/ReportIdPath'
        - $ref: '#/components/parameters/Deidentify'
      responses:
        '200':
          description: 报告详情
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportResponse'
              examples:
                draftWithAi:
