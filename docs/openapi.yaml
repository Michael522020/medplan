                        target:
                          patientXYZmm: [-28.1, 86.3, -12.5]
                          structureName: liver_right_lobe
                        approachAngleDeg: 32.5
                        corridorWidthMm: 18.0
                        avoidanceStructures: [portal_vein, inferior_vena_cava, gallbladder]
                        notes: '避开门静脉右后支，术中需超声辅助确认入路深度'
