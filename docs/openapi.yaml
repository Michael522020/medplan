  /api/v1/plans/{planId}:
    put:
      tags: [Planning]
      operationId: updatePlan
      summary: 更新规划方案（乐观锁，冲突返回 409）
      description: |
        **必须**携带 `version`（客户端最后读到的版本号）。这是 v1.0 唯一的一致性手段
        ——不用 CRDT/OT，理由见 ADR-006：CRDT 静默合并会产生临床错误且不可审计。

        冲突（`version` 与服务端当前值不一致）-> **HTTP 409** + `code 20003`，
        响应 `data.currentVersion` 与 `data.conflictingEditor` 供前端提示人工裁决
        （架构方案 12.2 E7）。

        服务端成功更新后 `version` 自增 1，并追加一条 `plan_commands` 操作日志
        （记录 before/after 值与操作人）。

        `status` 流转：`draft -> confirmed -> archived`。`archived` 后修改 -> `code 50004`
        （需医务部门审批凭证）。
      x-audit: true
      x-audit-event: PLAN_UPDATED
      x-audit-phi: true
      x-idempotent: true
      parameters:
        - $ref: '#/components/parameters/PlanIdPath'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePlanRequest'
            examples:
              adjustAngle:
                summary: 调整入路角度
                value:
                  version: 3
                  title: 肝右叶后段病灶楔形切除入路规划（修订）
                  payload:
                    entry:
                      patientXYZmm: [-65.8, 121.0, -36.8]
                      orientation: posterolateral_right
                    target:
                      patientXYZmm: [-28.1, 86.3, -12.5]
                      structureName: liver_right_lobe
                    approachAngleDeg: 27.0
                    corridorWidthMm: 22.5
                    avoidanceStructures: [portal_vein, inferior_vena_cava]
                    notes: '第二版：后移入针点 4mm 以增大与门静脉右后支间距'
      responses:
        '200':
          description: 更新成功，version 自增
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanResponse'
              examples:
                updated:
                  value:
                    code: 0
                    message: ''
                    data:
                      planId: 'plan-0a8305f2-3e91'
                      studyUid: '1.2.840.10008.5.1.4.1.1.2.20261022100336'
                      segmentationTaskId: 'seg-0a8301f4-77b2'
                      version: 4
                      status: draft
                      planType: hepatic_wedge_resection
                      title: 肝右叶后段病灶楔形切除入路规划（修订）
                      payload:
                        entry:
                          patientXYZmm: [-65.8, 121.0, -36.8]
                          orientation: posterolateral_right
                        target:
                          patientXYZmm: [-28.1, 86.3, -12.5]
                          structureName: liver_right_lobe
                        approachAngleDeg: 27.0
                        corridorWidthMm: 22.5
                        avoidanceStructures: [portal_vein, inferior_vena_cava]
                        notes: '第二版：后移入针点 4mm 以增大与门静脉右后支间距'
                      createdBy: 'u-2-0a82c401'
                      createdByNameMasked: '陈*'
