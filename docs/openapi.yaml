            **乐观锁版本冲突**（HTTP 409，`code 20003`）。
            响应携带服务端当前版本与最后编辑者，供前端提示人工裁决。

            同一状态码下另有两种业务冲突：`50003` 报告已签名（正文与规划方案一并锁定）、
            `50004` 方案已归档（修改需医务部门审批凭证）。前端按 `code` 分支，不看 HTTP 码。
