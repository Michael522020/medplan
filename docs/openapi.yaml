  /api/v1/segmentation-tasks:
    post:
      tags: [Segmentation]
      operationId: submitSegmentationTask
      summary: 提交 AI 辅助分割任务
      description: |
        提交 AI 分割任务。**非辅助决策类**功能（器审中心 2022 年第 8 号：
        自动分割被明确列举为非辅助决策），不触及三类证。

        三道服务端强校验（**不依赖前端**，防绕过）：

        1. **期相前置校验**（AI-01）：肝胆/泌尿/胸外方案要求增强期相。
           平扫或 `unknown` 期相提交 -> `code 20002`。避免浪费 GPU 与 10 分钟时限。
        2. **task 白名单校验**（AC-09）：TotalSegmentator 2.18.0 的 46 个 task 中
           仅 31 个为 Apache-2.0。`model` 枚举外的值 -> `code 40003` 并写审计。
           其中 `brain_aneurysm` 为 CC BY-NC 4.0 且不提供商业许可，**明确禁止**。
        3. **幂等校验**：`Idempotency-Key` 命中则返回既有任务，**不产生重复 GPU 计算**
           （Redis Stream 至少一次投递语义下的硬要求）。

        **GPU 降级（AC-10）**：显存 < 12GB 时后端强制 `fast = true`，
        响应中 `degraded = true`，前端须在 AI 结果区显示「降级模式（3mm 分辨率）」，
        且该标记随报告归档（合规要求不得静默降级）。

        端到端时限 ≤10 分钟（GPU 充足前提）。超时任务置 `failed` + `error.failedAtStep = fetch`。
      x-audit: true
      x-audit-event: SEGMENTATION_TASK_SUBMITTED
      x-audit-phi: true
      x-idempotent: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSegmentationTaskRequest'
            examples:
              liverPortal:
                summary: 肝脏门脉期全结构分割
                value:
                  studyUid: '1.2.840.10008.5.1.4.1.1.2.20261022100336'
                  seriesUid: '1.2.840.10008.5.1.4.1.1.2.20261022100336.728573'
                  model: total
                  fast: false
                  targetPhase: portal
              degradedFast:
                summary: 显存不足，强制降级
                value:
                  studyUid: '1.2.840.10008.5.1.4.1.1.2.20261022100336'
                  seriesUid: '1.2.840.10008.5.1.4.1.1.2.20261022100336.728573'
                  model: liver_segments
                  fast: false
                  targetPhase: portal
      responses:
        '201':
          description: 任务已入队
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateSegmentationTaskResponse'
              examples:
                queued:
                  summary: 已入队
                  value:
                    code: 0
                    message: ''
                    data:
                      taskId: 'seg-0a8301f4-77b2'
                      studyUid: '1.2.840.10008.5.1.4.1.1.2.20261022100336'
                      seriesUid: '1.2.840.10008.5.1.4.1.1.2.20261022100336.728573'
                      model: total
                      modelVersion: 2.18.0
                      weightsVersion: 'totalseg-2.18.0-weights-2026-08'
                      status: queued
                      fast: false
                      degraded: false
                      targetPhase: portal
                      estimatedWaitSeconds: 210
                      idempotentReplay: false
                      submittedBy: 'u-1-0a82f1a9'
                      submittedAt: '2026-10-22T10:42:18+08:00'
        '200':
          description: 幂等键命中，返回首次创建的任务（不重复占用 GPU）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateSegmentationTaskResponse'
              examples:
                replay:
                  value:
                    code: 0
                    message: ''
                    data:
                      taskId: 'seg-0a8301f4-77b2'
                      studyUid: '1.2.840.10008.5.1.4.1.1.2.20261022100336'
                      seriesUid: '1.2.840.10008.5.1.4.1.1.2.20261022100336.728573'
                      model: total
                      modelVersion: 2.18.0
                      weightsVersion: 'totalseg-2.18.0-weights-2026-08'
                      status: queued
                      fast: false
                      degraded: false
                      targetPhase: portal
                      estimatedWaitSeconds: 210
                      idempotentReplay: true
                      submittedBy: 'u-1-0a82f1a9'
                      submittedAt: '2026-10-22T10:42:18+08:00'
        '400':
          description: |
            参数错误，或模型许可不在白名单（`40003`）。
            白名单外示例见 forbiddenModelExample。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                forbiddenModel:
                  summary: 模型许可不在白名单（AC-09）
                  value:
                    code: 40003
                    message: '所选模型不在许可白名单内，无法提交'
                    traceId: '01JB2QA1M8KD3F7P2R5T9'
                    data:
                      # 回显被拒模型与许可信息，供 UIUX-P2 §4.3 拒绝态展示：
                      # 「请求模型 + 许可协议 + 错误码 + 可用模型下拉」
                      requestedModel: 'brain_aneurysm'
                      requestedLicense: 'CC BY-NC 4.0'
                      rejectionReason: '该task 为非商业许可，不提供商业使用授权'
                      allowedModels: [total, total_mr, liver_segments, lung_vessels]
                      # 供 UI 显示「本次拒绝已记入审计」
                      auditRecorded: true
