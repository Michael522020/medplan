  /api/v1/reports/{reportId}/sign:
    post:
      tags: [Reports]
      operationId: signReport
      summary: 医师电子签名（SM2 + CA + TSA）
      description: |
        符合 WS/T 847—2024《医学电子文档数字签名技术标准》与《电子签名法》第十三条。

        签名流程（服务端编排，密码运算全部委托密码机，应用层不实现密码算法）：
        1. **证书校验**：有效期 -> 颁发者链 -> 吊销列表。任一失败禁止签名（WS/T 847 要求）。
        2. **时间源校验**：向 TSA 请求权威时间，与本机时间偏移 > 60s -> **拒绝签名**，
           **不得用本地时间兜底**（AC-15，架构方案 12.2 E9）。
        3. **摘要绑定**：对报告规范化正文做 SM3 摘要（`bodyDigest`），与签名一同存储。
           正文改一字符，摘要变化 -> 原签名立即失效（AC-14）。
        4. **签名与时间戳同时执行**，一一对应（WS/T 847）。
        5. **前置业务校验**：五类受控字段任一为空 -> `code 10001`（AC-12）；
           AI 标记未全部确认 -> `code 20002`（AC-11）；
           未审核 -> `code 50001`。
        6. **签名日志独立写入 `signature_logs`**（含流水号、原文唯一序列号、
           服务主体标识、原文摘要值、摘要算法标识、证书序列号、签名数据），
           日志本身可被数字签名验证（WS/T 847，COM-10）。
        7. 成功后 `status = signed`，报告正文与关联规划方案**一并锁定**。

        **签名超时机制**：前端弹窗 5 分钟无操作自动关闭，须重新 UKey 认证
        （WS/T 847 超时要求）。

        **幂等**：同一 `Idempotency-Key` 重复提交返回同一签名结果，
        **不产生第二条流水号**（避免同一份报告出现两个签名记录）。

        签名值 `signatureValue` 为 Base64 编码的 SM2 签名值（DER 编码），
        由前端 UKey 内的私钥对 `SM3(nonce || reportId || version || bodyDigest)` 签名得到。
        **私钥不出 UKey**。
      x-audit: true
      x-audit-event: REPORT_SIGNED
      x-audit-phi: true
      x-idempotent: true
      parameters:
        - $ref: '#/components/parameters/ReportIdPath'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignReportRequest'
            examples:
              validSign:
                summary: 正常签名
                value:
                  reportVersion: 4
                  digestAlgorithm: SM3
                  ukeyCertSerial: '7921456789012345678901234567890'
                  nonce: 'b3f1c7e5092a4d68b1e3f5a7c9d2e4f6'
