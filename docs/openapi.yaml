  /api/v1/studies/{studyUid}/series:
    get:
      tags: [Studies]
      operationId: listSeriesByStudy
      summary: 序列列表（按期相自动分组）
      description: |
        返回该检查的全部序列，并按 DCM-02 规则自动归入四个期相分组：
        `plain`（平扫）/ `arterial`（动脉期）/ `portal`（门脉期）/ `delayed`（延迟期）/ `unknown`。

        每组带 `phaseConfidence`（期相识别置信度 0–1）。置信度 < 0.70 的分组前端须显示
        「期相待人工确认」标识，**不得**默认选中（错误期相会导致 AI 分割提交被拒）。

        走 `idx_series_phase` 索引。
      x-audit: true
      x-audit-event: STUDY_SERIES_VIEWED
      x-audit-phi: true
      x-idempotent: false
      parameters:
        - $ref: '#/components/parameters/StudyUidPath'
        - $ref: '#/components/parameters/Deidentify'
      responses:
        '200':
          description: 序列列表（已按期相分组）
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeriesGroupedResponse'
              examples:
                fourPhase:
                  summary: 腹部增强四期扫描
                  value:
                    code: 0
                    message: ''
                    data:
                      studyUid: '1.2.840.10008.5.1.4.1.1.2.20261022100336'
                      accessionNo: 'ACC20261022017'
                      modality: CT
                      studyDescription: 腹部平扫+三期增强
                      totalSeries: 4
                      totalInstances: 1042
                      phaseGroups:
                        - phase: plain
