  /api/v1/segmentation-tasks/{taskId}/confirm:
    post:
      tags: [Segmentation]
      operationId: confirmSegmentationItems
      summary: 医师逐项确认 AI 辅助标记
      description: |
        医师对每个 AI 结构逐项「确认」或「修改」（AC-11 / AI-03）。

        规则：
        1. `action = modified` 时 `modificationNote` **必填**，无备注的修改一律拒绝
           （`code 10001`）。修改留痕是电子病历「修改痕迹」要求的一部分。
        2. 幂等：同一 `Idempotency-Key` 重复提交不产生重复确认记录。
        3. 本端点**不**检查覆盖率（允许分批确认），但报告提交端点会检查
           `allConfirmed = true`（AC-11：未全部确认则报告不可提交）。
        4. `role` 不含 `report_signer` 的用户（如实习/试用期医师）可确认，
           但其确认记录带 `pendingSupervisorReview = true`，报告不可提交。

        幂等之外仍用乐观语义：同一 `structureName` 重复确认以最后一次为准，
        每次变更追加 `segmentation_confirms` 记录（append-only，不 UPDATE）。
      x-audit: true
      x-audit-event: SEGMENTATION_ITEM_CONFIRMED
      x-audit-phi: true
      x-idempotent: true
      parameters:
        - $ref: '#/components/parameters/TaskIdPath'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmSegmentationRequest'
            examples:
              mixedActions:
                summary: 部分确认、部分修改
                value:
                  items:
                    - structureName: liver
                      action: confirmed
                    - structureName: liver_right_lobe
                      action: confirmed
                    - structureName: gallbladder
                      action: modified
                      modificationNote: '胆囊壁增厚较明显，AI 轮廓未包含胆囊窝脂肪，请人工外扩 2mm 后确认'
                    - structureName: pancreas
                      action: confirmed
      responses:
        '200':
          description: 确认已记录
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmSegmentationResponse'
              examples:
                partial:
                  value:
                    code: 0
                    message: ''
                    data:
                      taskId: 'seg-0a8301f4-77b2'
                      accepted: 4
                      rejected: 0
                      confirmProgress:
                        total: 8
                        confirmed: 4
                        allConfirmed: false
                      pendingSupervisorReview: false
                      idempotentReplay: false
                      confirmedAt: '2026-10-22T10:58:36+08:00'
        '400':
          $ref: '#/components/responses/ErrInvalidParam'
        '401':
          $ref: '#/components/responses/ErrUnauthenticated'
        '403':
          $ref: '#/components/responses/ErrRoleForbidden'
        '404':
          $ref: '#/components/responses/ErrResourceNotFound'
        '409':
          description: 任务未成功结束，不可确认（`code 10001`）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: 10001
                message: '任务尚未成功完成，暂不可确认'
                traceId: '01JB2QA5R2SG7J1T6V9Y3'
        '422':
          description: |
            修改项缺少 `modificationNote`（`code 10001`）。

            **另一条同码路径**：会话身份与目标资源不匹配。
            例：用户提交的 `structureName` 不属于该任务在 PACS 中的实际分割结果，
            或该任务所属检查不在此用户的数据授权范围内。
            此时返回 `code 10003`（角色/归属级），**不是** 10004 ——
            因为 10004 保留给患者级越权（须与「患者不存在」不可区分），
            混用会污染那条安全语义。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missingNote:
                  summary: 修改项缺少修改说明
                  value:
                    code: 10001
                    message: '第 3 项action 为 modified，必须填写 modificationNote'
                    traceId: '01JB2QA5S3TH8K2U7W0Z'
                identityMismatch:
                  summary: 会话身份与资源归属不匹配
                  value:
                    code: 10003
                    message: '所确认的分割项不属于当前任务，或无权确认该检查的 AI 标记'
                    traceId: '01JB2QA5T4UJ9L3V8X1Y2'

  /api/v1/plans:
    post:
      tags: [Planning]
      operationId: createPlan
      summary: 保存规划方案
      description: |
        新建三维入路规划方案。v1.0 仅提供**乐观锁 + 操作日志**，
        不做多人实时协作标注（医学标注语义冲突无法由算法裁决，N1）。

        `payload` 为未定型结构（ADR-004：`jsonb` + GIN 索引，避免过早固定 Schema），
        但**必须**包含 `entry`（入路点）与 `target`（靶点）两组坐标，
        否则三维视图无法渲染。坐标单位为患者 DICOM 坐标系（mm）。

        幂等：双击保存不产生两份方案（AC 依 Idempotency-Key）。

        所有写操作经 `PlanCommandService`，产生可读操作日志（`plan_commands`），
        这是审计友好的关键（CRDT 内部状态不可读，ADR-006）。
      x-audit: true
      x-audit-event: PLAN_CREATED
      x-audit-phi: true
      x-idempotent: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlanRequest'
            examples:
              liverResection:
                summary: 肝右叶后段病灶楔形切除入路规划
                value:
                  studyUid: '1.2.840.10008.5.1.4.1.1.2.20261022100336'
                  segmentationTaskId: 'seg-0a8301f4-77b2'
                  planType: hepatic_wedge_resection
                  title: '肝右叶后段病灶楔形切除入路规划'
                  payload:
                    entry:
                      patientXYZmm: [-62.4, 118.7, -34.2]
                      orientation: posterolateral_right
                    target:
                      patientXYZmm: [-28.1, 86.3, -12.5]
                      structureName: liver_right_lobe
                    approachAngleDeg: 32.5
                    corridorWidthMm: 18.0
                    avoidanceStructures: [portal_vein, inferior_vena_cava, gallbladder]
                    notes: '避开门静脉右后支，术中需超声辅助确认入路深度'
      responses:
        '201':
          description: 方案已创建
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanResponse'
              examples:
                created:
                  value:
                    code: 0
                    message: ''
                    data:
